<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Program Builder — TBFlog</title>
    <link rel="stylesheet" href="style.css?v=7" />
    <link rel="stylesheet" href="athlete.css?v=15" />
  </head>
  <body>

    <header>
      <h1>TBFLOG</h1>
      <div style="display:flex; align-items:center; gap:16px">
        <button class="header-link" id="logoutBtn">Log Out</button>
      </div>
    </header>

    <div class="app-layout">
      <nav class="sidebar" id="pageSidebar">
        <button class="sidebar-toggle-btn" id="sidebarToggleBtn" title="Collapse sidebar">‹</button>
        <div class="sidebar-links" id="sidebarLinks">
          <a href="index.html" class="sidebar-link">Athletes</a>
          <div class="sidebar-item-hover">
            <span class="sidebar-link active">Library</span>
            <div class="sidebar-submenu">
              <a href="exercises.html">Exercise Library</a>
              <a href="trainings.html">Workout Library</a>
              <a href="programs.html">Program Library</a>
            </div>
          </div>
        </div>
      </nav>

      <div class="dashboard">
        <div class="dashboard-header">
          <h2 id="programNameHeading">Loading...</h2>
          <div style="display:flex; gap:12px">
            <button class="btn-profile-action" id="renameProgramBtn">✏ Rename</button>
            <button class="btn-add" id="addWeekBtn">+ Add Week</button>
          </div>
        </div>
        <div id="weeksList"></div>
      </div>
    </div>

    <!-- Rename Template Modal -->
    <div class="modal-overlay" id="renameProgramModal">
      <div class="modal">
        <h2>Rename Template</h2>
        <div class="form-group">
          <label>Name</label>
          <input type="text" id="renameProgramInput" />
        </div>
        <div class="form-actions">
          <button class="btn-cancel" id="cancelRenameProgramBtn">Cancel</button>
          <button class="btn-save" id="saveRenameProgramBtn">Save</button>
        </div>
      </div>
    </div>

    <!-- Add Day Modal -->
    <div class="modal-overlay" id="addDayModal">
      <div class="modal">
        <h2>Add Day</h2>
        <div class="form-group">
          <label>Label</label>
          <input type="text" id="addDayLabel" placeholder="e.g. Day 1 — Upper Body" />
        </div>
        <div class="form-actions">
          <button class="btn-cancel" id="cancelAddDayBtn">Cancel</button>
          <button class="btn-save" id="saveAddDayBtn">Add Day</button>
        </div>
      </div>
    </div>

    <!-- Exercise Picker Modal: pick an existing exercise from the library,
         or create a brand new one on the fly (opens createExerciseModal on
         top of this) - it's added as a bare row, ready to edit inline as a
         card right away (sets/reps/weight/rest/notes), same as dragging an
         exercise into a Training -->
    <div class="modal-overlay" id="exercisePickerModal">
      <div class="modal">
        <h2>Add Exercise</h2>
        <div class="form-group">
          <label>Exercise</label>
          <select id="pickerExerciseSelect">
            <option value="">Choose an exercise...</option>
          </select>
        </div>
        <p style="text-align:center; color:#aaaacc; font-size:13px; margin: 8px 0">or</p>
        <button class="btn-create-metric" id="createNewExerciseBtn">+ Create New Exercise</button>
        <div class="form-actions">
          <button class="btn-cancel" id="cancelExercisePickerBtn">Cancel</button>
          <button class="btn-save" id="saveExercisePickerBtn">Add to Day</button>
        </div>
      </div>
    </div>

    <!-- Create New Exercise Modal (opens on top of the picker above) -->
    <div class="modal-overlay" id="createExerciseModal">
      <div class="modal">
        <h2>Create New Exercise</h2>
        <div class="form-group">
          <label>Name</label>
          <input type="text" id="createExerciseName" placeholder="e.g. Romanian Deadlift" />
        </div>
        <div class="form-group">
          <label>Category</label>
          <select id="createExerciseCategory">
            <option value="__new__">+ Add New Category</option>
          </select>
        </div>
        <div class="form-group" id="createExerciseNewCategoryGroup" style="display:none">
          <label>New Category Name</label>
          <input type="text" id="createExerciseNewCategory" placeholder="e.g. Legs" />
        </div>
        <div class="form-group">
          <label>Type</label>
          <select id="createExerciseType">
            <option value="weights">Weightlifting (sets, reps, weight)</option>
            <option value="timed">Timed (sets, duration)</option>
            <option value="__new__">+ Add New Type</option>
          </select>
        </div>
        <div class="form-group" id="createExerciseNewTypeGroup" style="display:none">
          <label>New Type Name</label>
          <input type="text" id="createExerciseNewType" placeholder="e.g. Plyometric" />
        </div>
        <div class="form-group">
          <label>Video Link (optional)</label>
          <input type="url" id="createExerciseVideoUrl" placeholder="https://youtube.com/..." />
        </div>
        <div class="form-group">
          <label>Instructions (optional)</label>
          <textarea id="createExerciseInstructions" class="notes-textarea"></textarea>
        </div>
        <div class="form-actions">
          <button class="btn-cancel" id="cancelCreateExerciseBtn">Cancel</button>
          <button class="btn-save" id="saveCreateExerciseBtn">Create & Select</button>
        </div>
      </div>
    </div>

    <script type="module" src="loading-bar.js?v=1"></script>
    <script type="module" src="confirm-modal.js?v=1"></script>
    <script type="module" src="program-builder.js?v=6"></script>
    <script type="module" src="sidebar.js?v=1"></script>
  </body>
</html>
