<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Program Builder — TBFlog</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="athlete.css" />
  </head>
  <body>

    <header>
      <h1>TBFLOG</h1>
      <div style="display:flex; align-items:center; gap:16px">
        <a href="programs.html" class="back-btn">← Back to Program Library</a>
        <button class="header-link" id="logoutBtn">Log Out</button>
      </div>
    </header>

    <div class="app-layout">
      <nav class="sidebar">
        <a href="index.html" class="sidebar-link">Dashboard</a>
        <div class="sidebar-item-hover">
          <span class="sidebar-link active">Library</span>
          <div class="sidebar-submenu">
            <a href="exercises.html">Exercise Library</a>
            <a href="programs.html">Program Library</a>
          </div>
        </div>
      </nav>

      <div class="dashboard">
        <div class="dashboard-header">
          <h2 id="programNameHeading">Loading...</h2>
          <div style="display:flex; gap:12px">
            <button class="btn-profile-action" id="renameProgramBtn">✏ Rename</button>
            <button class="btn-add" id="addWeekBtn">+ Add Week</button>
          </div>
        </div>
        <div id="weeksList"></div>
      </div>
    </div>

    <!-- Rename Template Modal -->
    <div class="modal-overlay" id="renameProgramModal">
      <div class="modal">
        <h2>Rename Template</h2>
        <div class="form-group">
          <label>Name</label>
          <input type="text" id="renameProgramInput" />
        </div>
        <div class="form-actions">
          <button class="btn-cancel" id="cancelRenameProgramBtn">Cancel</button>
          <button class="btn-save" id="saveRenameProgramBtn">Save</button>
        </div>
      </div>
    </div>

    <!-- Add Day Modal -->
    <div class="modal-overlay" id="addDayModal">
      <div class="modal">
        <h2>Add Day</h2>
        <div class="form-group">
          <label>Label</label>
          <input type="text" id="addDayLabel" placeholder="e.g. Day 1 — Upper Body" />
        </div>
        <div class="form-actions">
          <button class="btn-cancel" id="cancelAddDayBtn">Cancel</button>
          <button class="btn-save" id="saveAddDayBtn">Add Day</button>
        </div>
      </div>
    </div>

    <!-- Exercise Picker Modal: pick an existing exercise from the library,
         or create a brand new one on the fly (opens createExerciseModal on
         top of this), then set prescribed sets/reps/weight/notes -->
    <div class="modal-overlay" id="exercisePickerModal">
      <div class="modal">
        <h2>Add Exercise</h2>
        <div class="form-group">
          <label>Exercise</label>
          <select id="pickerExerciseSelect">
            <option value="">Choose an exercise...</option>
          </select>
        </div>
        <p style="text-align:center; color:#aaaacc; font-size:13px; margin: 8px 0">or</p>
        <button class="btn-create-metric" id="createNewExerciseBtn">+ Create New Exercise</button>
        <div class="form-group" style="margin-top:16px">
          <label>Sets</label>
          <input type="number" id="pickerSets" placeholder="e.g. 3" />
        </div>
        <div class="form-group">
          <label>Reps</label>
          <input type="text" id="pickerReps" placeholder="e.g. 8-12" />
        </div>
        <div class="form-group">
          <label>Weight (kg, optional)</label>
          <input type="number" id="pickerWeight" placeholder="e.g. 60" />
        </div>
        <div class="form-group">
          <label>Notes (optional)</label>
          <input type="text" id="pickerNotes" placeholder="e.g. RPE 8, tempo 3-1-1" />
        </div>
        <div class="form-actions">
          <button class="btn-cancel" id="cancelExercisePickerBtn">Cancel</button>
          <button class="btn-save" id="saveExercisePickerBtn">Add to Day</button>
        </div>
      </div>
    </div>

    <!-- Create New Exercise Modal (opens on top of the picker above) -->
    <div class="modal-overlay" id="createExerciseModal">
      <div class="modal">
        <h2>Create New Exercise</h2>
        <div class="form-group">
          <label>Name</label>
          <input type="text" id="createExerciseName" placeholder="e.g. Romanian Deadlift" />
        </div>
        <div class="form-group">
          <label>Category</label>
          <input type="text" id="createExerciseCategory" placeholder="e.g. Legs" />
        </div>
        <div class="form-group">
          <label>Instructions (optional)</label>
          <textarea id="createExerciseInstructions" class="notes-textarea"></textarea>
        </div>
        <div class="form-actions">
          <button class="btn-cancel" id="cancelCreateExerciseBtn">Cancel</button>
          <button class="btn-save" id="saveCreateExerciseBtn">Create & Select</button>
        </div>
      </div>
    </div>

    <!-- Edit Scheduled Exercise Modal: only the prescribed sets/reps/weight/
         notes are editable here, not the exercise itself (delete + re-add
         to swap the exercise) -->
    <div class="modal-overlay" id="editExerciseModal">
      <div class="modal">
        <h2 id="editExerciseTitle">Edit Exercise</h2>
        <div class="form-group">
          <label>Sets</label>
          <input type="number" id="editSets" />
        </div>
        <div class="form-group">
          <label>Reps</label>
          <input type="text" id="editReps" />
        </div>
        <div class="form-group">
          <label>Weight (kg, optional)</label>
          <input type="number" id="editWeight" />
        </div>
        <div class="form-group">
          <label>Notes (optional)</label>
          <input type="text" id="editNotes" />
        </div>
        <div class="form-actions">
          <button class="btn-cancel" id="cancelEditExerciseBtn">Cancel</button>
          <button class="btn-save" id="saveEditExerciseBtn">Save Changes</button>
        </div>
      </div>
    </div>

    <script type="module" src="program-builder.js"></script>
  </body>
</html>
