<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Section Library — TBFlog</title>
    <link rel="stylesheet" href="style.css?v=12" />
    <link rel="stylesheet" href="athlete.css?v=22" />
  </head>
  <body>

    <header>
      <a href="index.html" class="header-logo-link"><img src="logo.png?v=1" alt="TBFlog" class="header-logo"></a>
      <div style="display:flex; align-items:center; gap:16px">
        <button class="header-link" id="logoutBtn">Log Out</button>
      </div>
    </header>

    <div class="app-layout">
      <nav class="sidebar" id="pageSidebar">
        <button class="sidebar-toggle-btn" id="sidebarToggleBtn" title="Collapse sidebar">‹</button>
        <div class="sidebar-links" id="sidebarLinks">
          <a href="index.html" class="sidebar-link">Athletes</a>
          <div class="sidebar-item-hover">
            <span class="sidebar-link active">Library</span>
            <div class="sidebar-submenu">
              <a href="exercises.html">Exercise Library</a>
              <a href="sections.html">Section Library</a>
              <a href="trainings.html">Workout Library</a>
              <a href="programs.html">Program Library</a>
            </div>
          </div>
        </div>
      </nav>

      <div class="dashboard">
        <div class="dashboard-header">
          <h2>Section Library</h2>
          <button class="btn-add" id="newSectionBtn">+ New Section</button>
        </div>
        <p style="color:#aaaacc; font-size:13px; margin-top:-16px; margin-bottom:24px">A section is a reusable group of exercises (e.g. "Warm-up A") - build once, then drop it into any workout or program day.</p>
        <div class="athlete-grid" id="sectionGrid"></div>
      </div>
    </div>

    <!-- New Section Modal: just a name - the exercise list gets built on
         section-builder.html after this redirects there -->
    <div class="modal-overlay" id="newSectionModal">
      <div class="modal">
        <h2>New Section</h2>
        <div class="form-group">
          <label>Name</label>
          <input type="text" id="newSectionName" placeholder="e.g. Warm-up A" />
        </div>
        <div class="form-actions">
          <button class="btn-cancel" id="cancelNewSectionBtn">Cancel</button>
          <button class="btn-save" id="saveNewSectionBtn">Create & Edit</button>
        </div>
      </div>
    </div>

    <script type="module" src="loading-bar.js?v=1"></script>
    <script type="module" src="confirm-modal.js?v=1"></script>
    <script type="module" src="network-retry.js?v=1"></script>
    <script type="module" src="sections.js?v=1"></script>
    <script type="module" src="sidebar.js?v=1"></script>
  </body>
</html>
