<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workout Library — TBFlog</title>
    <link rel="stylesheet" href="style.css?v=20" />
    <link rel="stylesheet" href="athlete.css?v=46" />
  </head>
  <body>

    <header>
      <a href="index.html" class="header-logo-link"><img src="logo.png?v=1" alt="TBFlog" class="header-logo"></a>
      <div style="display:flex; align-items:center; gap:16px">
        <button class="header-link" id="logoutBtn">Log Out</button>
      </div>
    </header>

    <div class="app-layout">
      <nav class="sidebar" id="pageSidebar">
        <button class="sidebar-toggle-btn" id="sidebarToggleBtn" title="Collapse sidebar">‹</button>
        <div class="sidebar-links" id="sidebarLinks">
          <div class="sidebar-item-hover" id="athletesNavItem">
            <a href="index.html" class="sidebar-link">Athletes</a>
            <div class="sidebar-submenu">
              <a href="index.html?status=active">Active</a>
              <a href="index.html?status=pending">Pending</a>
              <a href="index.html?status=offline">Offline</a>
              <a href="index.html?status=archived">Archived</a>
            </div>
          </div>
          <div class="sidebar-item-hover">
            <span class="sidebar-link active">Library</span>
            <div class="sidebar-submenu">
              <a href="exercises.html">Exercise Library</a>
              <a href="sections.html">Section Library</a>
              <a href="trainings.html">Workout Library</a>
              <a href="programs.html">Program Library</a>
            </div>
          </div>
          <a href="stretches.html" class="sidebar-link">Stretch Library</a>
          <a href="settings.html" class="sidebar-link">⚙ Settings</a>
        </div>
      </nav>

      <div class="dashboard">
        <div class="dashboard-header">
          <h2>Workout Library</h2>
          <button class="btn-add" id="newTrainingBtn">+ New Workout</button>
        </div>
        <p style="color:#aaaacc; font-size:13px; margin-top:-16px; margin-bottom:24px">A workout is a flat list of exercises - build once, then drop it onto any athlete's calendar.</p>
        <div class="athlete-grid" id="trainingGrid"></div>
      </div>
    </div>

    <!-- New Training Modal: just a name - the exercise list gets built on
         training-builder.html after this redirects there -->
    <div class="modal-overlay" id="newTrainingModal">
      <div class="modal">
        <h2>New Workout</h2>
        <div class="form-group">
          <label>Name</label>
          <input type="text" id="newTrainingName" placeholder="e.g. Leg Day" />
        </div>
        <div class="form-actions">
          <button class="btn-cancel" id="cancelNewTrainingBtn">Cancel</button>
          <button class="btn-save" id="saveNewTrainingBtn">Create & Edit</button>
        </div>
      </div>
    </div>

    <script type="module" src="loading-bar.js?v=1"></script>
    <script type="module" src="confirm-modal.js?v=1"></script>
    <script type="module" src="network-retry.js?v=1"></script>
    <script type="module" src="trainings.js?v=4"></script>
    <script type="module" src="bell.js?v=3"></script>
    <script type="module" src="sidebar.js?v=1"></script>
  </body>
</html>
