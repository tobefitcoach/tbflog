<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Training Library — TBFlog</title>
    <link rel="stylesheet" href="style.css?v=7" />
    <link rel="stylesheet" href="athlete.css?v=14" />
  </head>
  <body>

    <header>
      <h1>TBFLOG</h1>
      <div style="display:flex; align-items:center; gap:16px">
        <button class="header-link" id="logoutBtn">Log Out</button>
      </div>
    </header>

    <div class="app-layout">
      <nav class="sidebar" id="pageSidebar">
        <button class="sidebar-toggle-btn" id="sidebarToggleBtn" title="Collapse sidebar">‹</button>
        <div class="sidebar-links" id="sidebarLinks">
          <a href="index.html" class="sidebar-link">Athletes</a>
          <div class="sidebar-item-hover">
            <span class="sidebar-link active">Library</span>
            <div class="sidebar-submenu">
              <a href="exercises.html">Exercise Library</a>
              <a href="trainings.html">Training Library</a>
              <a href="programs.html">Program Library</a>
            </div>
          </div>
        </div>
      </nav>

      <div class="dashboard">
        <div class="dashboard-header">
          <h2>Training Library</h2>
          <button class="btn-add" id="newTrainingBtn">+ New Training</button>
        </div>
        <p style="color:#aaaacc; font-size:13px; margin-top:-16px; margin-bottom:24px">A training is a single reusable workout (a flat list of exercises) - build once, then drop it onto any athlete's calendar.</p>
        <div class="athlete-grid" id="trainingGrid"></div>
      </div>
    </div>

    <!-- New Training Modal: just a name - the exercise list gets built on
         training-builder.html after this redirects there -->
    <div class="modal-overlay" id="newTrainingModal">
      <div class="modal">
        <h2>New Training</h2>
        <div class="form-group">
          <label>Name</label>
          <input type="text" id="newTrainingName" placeholder="e.g. Leg Day" />
        </div>
        <div class="form-actions">
          <button class="btn-cancel" id="cancelNewTrainingBtn">Cancel</button>
          <button class="btn-save" id="saveNewTrainingBtn">Create & Edit</button>
        </div>
      </div>
    </div>

    <script type="module" src="trainings.js?v=1"></script>
    <script type="module" src="sidebar.js?v=1"></script>
  </body>
</html>
