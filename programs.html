      <div class="dashboard">
        <div class="dashboard-header">
          <h2>Program Library</h2>
          <button class="btn-add" id="newTemplateBtn">+ New Template</button>
        </div>
        <div class="athlete-grid" id="programGrid"></div>
      </div>
    </div>

    <!-- New Template Modal: name + week count - that many program_weeks
         rows get created immediately, so program-builder.html opens with
         the weeks already there instead of clicking "+ Add Week" N times.
         Days/exercises still get built on program-builder.html after this
         redirects there. -->
    <div class="modal-overlay" id="newTemplateModal">
      <div class="modal">
        <h2>New Program Template</h2>
        <div class="form-group">
          <label>Name</label>
          <input type="text" id="newTemplateName" placeholder="e.g. Push Pull Legs - Hypertrophy" />
        </div>
        <div class="form-group">
          <label>Number of Weeks</label>
          <input type="number" id="newTemplateWeeks" value="4" min="1" max="52" />
        </div>
        <div class="form-actions">
          <button class="btn-cancel" id="cancelNewTemplateBtn">Cancel</button>
          <button class="btn-save" id="saveNewTemplateBtn">Create & Edit</button>
        </div>
      </div>
    </div>

    <script type="module" src="loading-bar.js?v=1"></script>
