<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard — TBFlog</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0d0d1a" />
    <link rel="stylesheet" href="../style.css?v=29" />
    <link rel="stylesheet" href="../athlete.css?v=61" />
    <link rel="stylesheet" href="app.css?v=54" />
  </head>
  <body>

    <!-- Covers the screen for exactly 3s on every app open, logo animating
         in then out, so the athlete sees a branded moment instead of the
         bare "Loading..." text underneath (which is still there for the
         rare case data takes longer than 3s to arrive) -->
    <div class="splash-screen" id="splashScreen" aria-hidden="true">
      <img src="../logo.png?v=1" alt="" class="splash-logo" />
    </div>

    <header>
      <a href="dashboard.html" class="header-logo-link"><img src="../logo.png?v=1" alt="TBFlog" class="header-logo"></a>
    </header>

    <!-- dashboard.js decides what goes in here: a loading message, a "wrong
         account type" message, a "waiting to be linked" message, or (once
         the training-program feature exists) the real dashboard -->
    <div class="athlete-app-page">
      <div class="athlete-app-card" id="pageContent">
        <div class="skeleton-bar" style="width:60%; height:22px; margin-bottom:20px"></div>
        <div style="display:flex; gap:8px; margin-bottom:20px">
          <div class="skeleton-bar" style="flex:1; height:64px"></div>
          <div class="skeleton-bar" style="flex:1; height:64px"></div>
          <div class="skeleton-bar" style="flex:1; height:64px"></div>
          <div class="skeleton-bar" style="flex:1; height:64px"></div>
          <div class="skeleton-bar" style="flex:1; height:64px"></div>
        </div>
        <div class="skeleton-bar" style="height:72px; margin-bottom:12px"></div>
        <div class="skeleton-bar" style="height:72px"></div>
      </div>
    </div>

    <!-- Shown at most once per week, the first time the athlete opens the
         app that week - see maybeShowWeeklyRecap() in dashboard.js -->
    <div class="modal-overlay" id="weeklyRecapModal">
      <div class="modal">
        <h2>Last Week's Recap</h2>
        <div id="weeklyRecapBody"></div>
        <div class="form-actions" style="justify-content:flex-end; margin-top:24px">
          <button class="btn-save" id="weeklyRecapCloseBtn">Nice!</button>
        </div>
      </div>
    </div>

    <!-- Coach message(s) - shown either right after entering the app
         (queued 'on_open' rows) or right before Start/Continue Workout
         (queued 'before_workout' rows, via startWorkout()) - see
         showCoachMessagesModal() in dashboard.js. The Continue button's
         label/action are set per-show: closes-only for on_open, actually
         starts the workout for before_workout. -->
    <div class="modal-overlay" id="coachMessageModal">
      <div class="modal">
        <h2>Message from your coach</h2>
        <div id="coachMessageBody"></div>
        <div class="form-actions" style="justify-content:flex-end; margin-top:24px">
          <button class="btn-save" id="coachMessageContinueBtn">Got it</button>
        </div>
      </div>
    </div>

    <!-- Per-exercise history, opened via the 📈 History button during a
         guided workout - see openExerciseHistoryModal() in dashboard.js -->
    <div class="modal-overlay" id="exerciseHistoryModal">
      <div class="modal">
        <div class="graph-modal-header">
          <h2 id="exerciseHistoryTitle">History</h2>
          <button type="button" class="btn-cancel" id="closeExerciseHistoryBtn">✕</button>
        </div>
        <div class="graph-time-filters" id="exerciseHistoryTimeFilters" style="margin: 4px 0 16px">
          <button type="button" class="time-filter-btn" data-months="1">1M</button>
          <button type="button" class="time-filter-btn active" data-months="3">3M</button>
          <button type="button" class="time-filter-btn" data-months="6">6M</button>
        </div>
        <div id="exerciseHistoryBody"></div>
      </div>
    </div>

    <!-- Swap a coach-prescribed exercise for a different one from the
         library, opened via the 🔁 Swap button - see openSwapModal() in
         dashboard.js. Same search+list shape as the full-page Add Exercise
         screen, just in a modal so the athlete doesn't lose their place -->
    <div class="modal-overlay" id="exerciseSwapModal">
      <div class="modal">
        <div class="graph-modal-header">
          <h2>Swap Exercise</h2>
          <button type="button" class="btn-cancel" id="closeExerciseSwapBtn">✕</button>
        </div>
        <input type="text" id="exerciseSwapSearchInput" class="exercise-search-input" placeholder="Search exercises..." />
        <div id="exerciseSwapList"></div>
      </div>
    </div>

    <!-- Reschedule a workout to a different day, opened via the 📅 Move
         button - see openMoveWorkoutModal() in dashboard.js. Only shown when
         the coach has turned on can_reschedule_workouts for this athlete -->
    <div class="modal-overlay" id="moveWorkoutModal">
      <div class="modal">
        <div class="graph-modal-header">
          <h2>Move Workout</h2>
          <button type="button" class="btn-cancel" id="closeMoveWorkoutBtn">✕</button>
        </div>
        <div class="form-group">
          <label>New Date</label>
          <input type="date" id="moveWorkoutDateInput" />
        </div>
        <div class="form-actions">
          <button class="btn-cancel" id="cancelMoveWorkoutBtn">Cancel</button>
          <button class="btn-save" id="saveMoveWorkoutBtn">Move</button>
        </div>
      </div>
    </div>

    <!-- Persistent tab bar, lives outside #pageContent so it survives every
         full-page swap dashboard.js does - see the "BOTTOM NAV" section in
         dashboard.js. Hidden until enterWeekView() has a real athlete to
         navigate for; #navStatsBtn additionally stays hidden unless the
         coach has can_view_weekly_stats on. -->
    <nav class="bottom-nav" id="bottomNav" style="display:none">
      <button type="button" class="bottom-nav-btn" id="navHomeBtn" data-tab="home">
        <span class="bottom-nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="4 11.5 12 5 20 11.5"/>
            <polyline points="6 10.5 6 19 18 19 18 10.5"/>
            <line x1="10" y1="19" x2="10" y2="14"/>
            <line x1="14" y1="19" x2="14" y2="14"/>
            <line x1="10" y1="14" x2="14" y2="14"/>
          </svg>
        </span>
        <span class="bottom-nav-label">Home</span>
      </button>
      <button type="button" class="bottom-nav-btn" id="navStatsBtn" data-tab="stats" style="display:none">
        <span class="bottom-nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="20" x2="5" y2="11"/>
            <line x1="12" y1="20" x2="12" y2="4"/>
            <line x1="19" y1="20" x2="19" y2="14"/>
          </svg>
        </span>
        <span class="bottom-nav-label">Stats</span>
      </button>
      <button type="button" class="bottom-nav-btn" id="navCommsBtn" data-tab="communication">
        <span class="bottom-nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
          </svg>
        </span>
        <span class="bottom-nav-label">Chat</span>
      </button>
      <button type="button" class="bottom-nav-btn" id="navSettingsBtn" data-tab="settings">
        <span class="bottom-nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="6" x2="20" y2="6"/>
            <circle cx="15" cy="6" r="2"/>
            <line x1="4" y1="12" x2="20" y2="12"/>
            <circle cx="9" cy="12" r="2"/>
            <line x1="4" y1="18" x2="20" y2="18"/>
            <circle cx="17" cy="18" r="2"/>
          </svg>
        </span>
        <span class="bottom-nav-label">Settings</span>
      </button>
      <button type="button" class="bottom-nav-btn" id="navProfileBtn" data-tab="profile">
        <span class="bottom-nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"/>
            <polyline points="4 20 6 15 18 15 20 20"/>
          </svg>
        </span>
        <span class="bottom-nav-label">Profile</span>
      </button>
    </nav>

    <script type="module" src="../loading-bar.js?v=1"></script>
    <script type="module" src="../confirm-modal.js?v=1"></script>
    <script type="module" src="../network-retry.js?v=1"></script>
    <script type="module" src="dashboard.js?v=108"></script>
  </body>
</html>
