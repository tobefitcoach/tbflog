<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard — TBFlog</title>
    <link rel="stylesheet" href="../style.css?v=6" />
    <link rel="stylesheet" href="../athlete.css?v=7" />
    <link rel="stylesheet" href="app.css?v=3" />
  </head>
  <body>

    <header>
      <h1>TBFLOG</h1>
      <div style="display:flex; align-items:center; gap:16px">
        <p>Athlete Dashboard</p>
        <button class="header-link" id="logoutBtn">Log Out</button>
      </div>
    </header>

    <!-- dashboard.js decides what goes in here: a loading message, a "wrong
         account type" message, a "waiting to be linked" message, or (once
         the training-program feature exists) the real dashboard -->
    <div class="athlete-app-page">
      <div class="athlete-app-card" id="pageContent">
        <p>Loading...</p>
      </div>
    </div>

    <!-- Video player - one shared modal, opened from any exercise thumbnail.
         Closing resets the iframe src to about:blank to stop playback. -->
    <div class="modal-overlay" id="videoModal">
      <div class="modal">
        <div class="graph-modal-header">
          <h2>Video</h2>
          <button class="btn-cancel" id="closeVideoModalBtn">✕</button>
        </div>
        <div class="video-modal-frame">
          <iframe id="videoModalIframe" src="about:blank" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
      </div>
    </div>

    <script type="module" src="dashboard.js?v=4"></script>
  </body>
</html>
