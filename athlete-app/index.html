<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Athlete Login — TBFlog</title>
    <link rel="stylesheet" href="../style.css?v=31" />
    <link rel="stylesheet" href="../login.css?v=4" />

    <!-- Supabase's ESM build on jsDelivr is not bundled: importing
         supabase-js fans out into 8 more modules, and the browser cannot
         discover them until supabase-js itself has downloaded and parsed,
         so they arrive as a 9-deep waterfall of round trips rather than in
         parallel. Measured cold on a throttled mobile connection, that
         chain didn't even START until ~610ms in and ran to ~1650ms - for
         only ~73KB gzipped, so it's almost entirely latency, not bytes.
         Declaring them here lets all 9 fetch at once, immediately.
         These are hints, not imports - they change nothing about what the
         app loads, only when. If the pinned supabase-js version in
         athleteClient.js changes, update this list to match; a stale entry
         is harmless (an unused-preload console warning) but buys nothing.
         The coach app carries the identical block - see
         coach-app/dashboard.html. -->
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.0/+esm" />
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@supabase/auth-js@2.112.0/+esm" />
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@supabase/postgrest-js@2.112.0/+esm" />
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@supabase/realtime-js@2.112.0/+esm" />
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@supabase/storage-js@2.112.0/+esm" />
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@supabase/functions-js@2.112.0/+esm" />
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@supabase/phoenix@0.4.5/+esm" />
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/iceberg-js@0.8.1/+esm" />
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/tslib@2.8.1/+esm" />
  </head>
  <body>

    <header class="login-header">
      <img src="../logo.png?v=2" alt="TBFlog" class="header-logo">
      <p>Athlete Login</p>
    </header>

    <!-- Toggles between Log In and Sign Up via login.js. Sign up with the
         SAME email your coach put in your profile - that's how your account
         gets matched up to your existing athlete record automatically. -->
    <div class="auth-page">
      <div class="modal auth-card">
        <h2 id="authTitle">Log In</h2>

        <p class="auth-message" id="authMessage"></p>

        <div class="form-group" id="nameField" style="display:none">
          <label>Your Name</label>
          <input type="text" id="authName" placeholder="e.g. Alex Athlete" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="authEmail" placeholder="you@email.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="authPassword" placeholder="At least 6 characters" />
        </div>

        <div class="form-actions" style="justify-content:stretch">
          <button class="btn-save" id="authSubmitBtn" style="width:100%">Log In</button>
        </div>

        <p class="auth-toggle">
          <span id="authToggleText">Don't have an account?</span>
          <a href="#" id="authToggleLink">Sign up</a>
        </p>
      </div>
    </div>

    <script type="module" src="../loading-bar.js?v=1"></script>
    <script type="module" src="../confirm-modal.js?v=2"></script>
    <script type="module" src="login.js?v=2"></script>
  </body>
</html>
