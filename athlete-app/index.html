<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Athlete Login — TBFlog</title>
    <link rel="stylesheet" href="../style.css?v=29" />
    <link rel="stylesheet" href="../login.css?v=1" />
  </head>
  <body>

    <header class="login-header">
      <img src="../logo.png?v=1" alt="TBFlog" class="header-logo">
      <p>Athlete Login</p>
    </header>

    <!-- Toggles between Log In and Sign Up via login.js. Sign up with the
         SAME email your coach put in your profile - that's how your account
         gets matched up to your existing athlete record automatically. -->
    <div class="auth-page">
      <div class="modal auth-card">
        <h2 id="authTitle">Log In</h2>

        <p class="auth-message" id="authMessage"></p>

        <div class="form-group" id="nameField" style="display:none">
          <label>Your Name</label>
          <input type="text" id="authName" placeholder="e.g. Alex Athlete" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="authEmail" placeholder="you@email.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="authPassword" placeholder="At least 6 characters" />
        </div>

        <div class="form-actions" style="justify-content:stretch">
          <button class="btn-save" id="authSubmitBtn" style="width:100%">Log In</button>
        </div>

        <p class="auth-toggle">
          <span id="authToggleText">Don't have an account?</span>
          <a href="#" id="authToggleLink">Sign up</a>
        </p>
      </div>
    </div>

    <script type="module" src="../loading-bar.js?v=1"></script>
    <script type="module" src="../confirm-modal.js?v=1"></script>
    <script type="module" src="login.js?v=2"></script>
  </body>
</html>
