<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Page metadata + stylesheet -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TBFlog</title>
    <link rel="stylesheet" href="style.css?v=13" />
    <link rel="stylesheet" href="athlete.css?v=34" />
  </head>
  <body>

    <!-- Top header bar -->
    <header>
      <a href="index.html" class="header-logo-link"><img src="logo.png?v=1" alt="TBFlog" class="header-logo"></a>
      <div style="display:flex; align-items:center; gap:16px">
        <p>Coach Dashboard</p>
        <p id="loggedInAs" style="color:#aaaacc; font-size:13px"></p>
        <button class="header-link" id="logoutBtn">Log Out</button>
      </div>
    </header>

    <div class="app-layout">

      <!-- Left sidebar nav. "Library" reveals Exercise/Program Library on
           click, expanding underneath it (.sidebar-submenu) -->
      <nav class="sidebar" id="pageSidebar">
        <button class="sidebar-toggle-btn" id="sidebarToggleBtn" title="Collapse sidebar">‹</button>
        <div class="sidebar-links" id="sidebarLinks">
          <a href="index.html" class="sidebar-link active">Athletes</a>
          <div class="sidebar-item-hover">
            <span class="sidebar-link">Library</span>
            <div class="sidebar-submenu">
              <a href="exercises.html">Exercise Library</a>
              <a href="sections.html">Section Library</a>
              <a href="trainings.html">Workout Library</a>
              <a href="programs.html">Program Library</a>
            </div>
          </div>
          <a href="stretches.html" class="sidebar-link">Stretch Library</a>
        </div>
      </nav>

      <!-- ====================================================================
           DASHBOARD — Athlete grid
           script.js renders one card per athlete into .athlete-grid, and the
           status chip row above it filters that render client-side (no
           re-query) - see applyStatusFilter() in script.js.
           ==================================================================== -->
      <div class="dashboard">
    <div class="dashboard-header">
      <h2>Your Athletes</h2>
      <button class="btn-add">+ Add Athlete</button>
    </div>
        <div class="chip-row" id="athleteStatusFilter">
          <button type="button" class="chip-btn selected" data-status="active">Active</button>
          <button type="button" class="chip-btn" data-status="pending">Pending</button>
          <button type="button" class="chip-btn" data-status="offline">Offline</button>
          <button type="button" class="chip-btn" data-status="archived">Archived</button>
        </div>
        <div class="athlete-grid"></div>
      </div>
    </div>

<!-- Add Athlete Modal: form for creating a new athlete (hidden by default,
     shown via the "active" class from script.js) -->
<div class="modal-overlay" id="addAthleteModal">
  <div class="modal">
    <h2>Add Athlete</h2>

    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="athleteName" placeholder="e.g. John Doe" />
    </div>

    <div class="form-group">
      <label>Date of Birth</label>
      <input type="date" id="athleteDOB" />
    </div>

    <div class="form-group">
      <label>Gender</label>
      <select id="athleteGender">
        <option value="">Select gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <div class="form-group">
      <label>Height (cm)</label>
      <input type="number" id="athleteHeight" placeholder="e.g. 180" />
    </div>

    <div class="form-group">
      <label>Email (for athlete login)</label>
      <input type="email" id="athleteEmail" placeholder="athlete@email.com" />
    </div>

    <div class="form-actions">
      <button class="btn-cancel" id="cancelBtn">Cancel</button>
      <button class="btn-save" id="saveBtn">Save Athlete</button>
    </div>
  </div>
</div>

<!-- Main page logic (see script.js) -->
<script type="module" src="loading-bar.js?v=1"></script>
<script type="module" src="confirm-modal.js?v=1"></script>
<script type="module" src="network-retry.js?v=1"></script>
<script type="module" src="script.js?v=8"></script>
<script type="module" src="sidebar.js?v=1"></script>
  </body>
</html>
