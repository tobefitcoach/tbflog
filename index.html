<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Page metadata + stylesheet -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TBFlog</title>
    <link rel="stylesheet" href="style.css?v=28" />
    <link rel="stylesheet" href="athlete.css?v=53" />
  </head>
  <body>

    <!-- Top header bar -->
    <header>
      <a href="index.html" class="header-logo-link"><img src="logo.png?v=1" alt="TBFlog" class="header-logo"></a>
      <div style="display:flex; align-items:center; gap:16px" id="headerActions">
        <p>Coach Dashboard</p>
        <p id="loggedInAs" style="color:#aaaacc; font-size:13px"></p>
      </div>
    </header>

    <div class="app-layout">

      <!-- Left sidebar nav. "Athletes" and "Library" both expand a submenu
           on click, mutually exclusive (see sidebar.js) - "Athletes" is a
           real link to index.html on every OTHER page, but sidebar.js
           intercepts the click here (where navigating there would just be
           a pointless reload) and toggles the submenu instead, same as
           "Library"'s non-navigating span. Active/Pending/Offline/Archived
           is what used to be the chip row under the search bar - shown as
           a wrapping row of pills (see #athleteStatusFilter in style.css),
           not the stacked list it started as. -->
      <nav class="sidebar" id="pageSidebar">
        <button class="sidebar-toggle-btn" id="sidebarToggleBtn" title="Collapse sidebar">‹</button>
        <div class="sidebar-links" id="sidebarLinks">
          <div class="sidebar-item-hover" id="athletesNavItem">
            <a href="index.html" class="sidebar-link sidebar-link-icon active"><svg class="sidebar-link-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>Athletes</a>
            <div class="sidebar-submenu" id="athleteStatusFilter">
              <a href="index.html?status=active" data-status="active">Active</a>
              <a href="index.html?status=pending" data-status="pending">Pending</a>
              <a href="index.html?status=offline" data-status="offline">Offline</a>
              <a href="index.html?status=archived" data-status="archived">Archived</a>
            </div>
          </div>
          <a href="communication.html" class="sidebar-link sidebar-link-icon"><svg class="sidebar-link-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>Communication</a>
          <div class="sidebar-item-hover">
            <span class="sidebar-link sidebar-link-icon"><svg class="sidebar-link-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>Library</span>
            <div class="sidebar-submenu">
              <a href="exercises.html">Exercise Library</a>
              <a href="sections.html">Section Library</a>
              <a href="trainings.html">Workout Library</a>
              <a href="programs.html">Program Library</a>
            </div>
          </div>
          <a href="stretches.html" class="sidebar-link sidebar-link-icon"><svg class="sidebar-link-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>Stretch Library</a>
          <a href="settings.html" class="sidebar-link sidebar-link-icon"><svg class="sidebar-link-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>Settings</a>
        </div>
      </nav>

      <!-- ====================================================================
           DASHBOARD — Athlete grid
           script.js renders one card per athlete into .athlete-grid. Status
           filtering now lives in the sidebar submenu above (?status= links);
           the label filter dropdown below filters client-side on top of
           that - see applyFilters() in script.js.
           ==================================================================== -->
      <div class="dashboard">
    <div class="dashboard-header">
      <h2>Your Athletes</h2>
      <div style="display:flex; gap:10px">
        <button class="btn-profile-action" id="messageAthletesBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px; margin-right:6px"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>Message Athletes</button>
        <button class="btn-add">+ Add Athlete</button>
      </div>
    </div>
        <input type="text" id="athleteSearchInput" class="exercise-search-input" placeholder="Search athletes by name..." />
        <div class="label-filter" id="labelFilter">
          <button type="button" class="btn-profile-action" id="labelFilterBtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px; margin-right:4px"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>Filter by Label</button>
          <div class="label-filter-dropdown" id="labelFilterDropdown">
            <div class="entries-modal-body" id="labelFilterList"></div>
            <div class="label-filter-new">
              <input type="text" id="newLabelInput" placeholder="New label name..." maxlength="40" />
              <button type="button" id="addLabelBtn">+ Add</button>
            </div>
          </div>
        </div>
        <div class="athlete-grid"></div>
      </div>
    </div>

<!-- Add Athlete Modal: form for creating a new athlete (hidden by default,
     shown via the "active" class from script.js) -->
<div class="modal-overlay" id="addAthleteModal">
  <div class="modal">
    <h2>Add Athlete</h2>

    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="athleteName" placeholder="e.g. John Doe" />
    </div>

    <div class="form-group">
      <label>Date of Birth</label>
      <input type="date" id="athleteDOB" />
    </div>

    <div class="form-group">
      <label>Gender</label>
      <select id="athleteGender">
        <option value="">Select gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <div class="form-group">
      <label>Height (cm)</label>
      <input type="number" id="athleteHeight" placeholder="e.g. 180" />
    </div>

    <div class="form-group">
      <label>Email (for athlete login)</label>
      <input type="email" id="athleteEmail" placeholder="athlete@email.com" />
    </div>

    <div class="form-actions">
      <button class="btn-cancel" id="cancelBtn">Cancel</button>
      <button class="btn-save" id="saveBtn">Save Athlete</button>
    </div>
  </div>
</div>

<!-- Manage Labels Modal: tag/untag one athlete with any of the coach's
     labels - opened from that athlete's kebab menu. Checking a box saves
     immediately (same optimistic pattern as Archive), no separate Save
     button needed. -->
<div class="modal-overlay" id="manageLabelsModal">
  <div class="modal">
    <h2>Manage Labels</h2>
    <p style="color:#aaaacc; font-size:13px; margin-top:-8px" id="manageLabelsAthleteName"></p>
    <div class="entries-modal-body" id="manageLabelsList"></div>
    <div class="label-filter-new">
      <input type="text" id="manageLabelsNewInput" placeholder="New label name..." maxlength="40" />
      <button type="button" id="manageLabelsAddBtn">+ Add</button>
    </div>
    <div class="form-actions">
      <button class="btn-cancel" id="closeManageLabelsBtn">Close</button>
    </div>
  </div>
</div>

<!-- Message Athletes Modal: compose + send, to all athletes or specific
     ones, shown either the next time they open the app, right before they
     start their next workout, or immediately as a real push notification -
     see the sendMessageAthletesBtn handler in script.js. -->
<div class="modal-overlay" id="messageAthletesModal">
  <div class="modal">
    <div class="graph-modal-header">
      <h2>Message Athletes</h2>
      <button type="button" class="btn-cancel" id="closeMessageAthletesBtn">✕</button>
    </div>
    <div class="form-group">
      <label>Message</label>
      <textarea id="coachMessageText" class="notes-textarea" placeholder="e.g. Reminder: no training tomorrow, enjoy the rest day!"></textarea>
    </div>
    <div class="form-group">
      <label>When should they see it?</label>
      <div class="chip-row" id="messageTimingChips">
        <button type="button" class="chip-btn selected" data-timing="on_open">When they open the app</button>
        <button type="button" class="chip-btn" data-timing="before_workout">Right before they start a workout</button>
        <button type="button" class="chip-btn" data-timing="push">Push notification, right now</button>
      </div>
    </div>
    <div class="form-group">
      <label>Send to</label>
      <label class="bodyweight-toggle" style="margin-bottom:10px"><span>All athletes</span>
        <span class="toggle-switch"><input type="checkbox" id="messageToAllToggle" checked><span class="toggle-slider"></span></span>
      </label>
      <div id="messageRecipientList" class="entries-modal-body" style="display:none"></div>
    </div>
    <div class="form-actions">
      <button class="btn-cancel" id="cancelMessageAthletesBtn">Cancel</button>
      <button class="btn-save" id="sendMessageAthletesBtn">Send</button>
    </div>
  </div>
</div>

<!-- Main page logic (see script.js) -->
<script type="module" src="loading-bar.js?v=1"></script>
<script type="module" src="confirm-modal.js?v=1"></script>
<script type="module" src="network-retry.js?v=1"></script>
<script type="module" src="script.js?v=19"></script>
<script type="module" src="bell.js?v=4"></script>
<script type="module" src="sidebar.js?v=2"></script>
  </body>
</html>
