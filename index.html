      body { margin: 0; height: 100vh; background-color: #0f0f1a; }

  <body>
    <!-- This file used to be the coach dashboard directly (script.js +
         the athlete-grid page) - that's now coach-app/screens/athletes.js,
         reached through app/index.html's role router.
         GitHub Pages needs SOME document at the bare repo root, so this
         stays as a minimal one-line forward rather than being deleted -
         anyone with the site's bare domain bookmarked (from before this
         rebuild) still lands somewhere real instead of a 404. Everything
         that used to link here directly (login.js, training-builder.html,
         privacy.html) can link straight to app/index.html instead and
         skip this hop entirely - update those over time as they're
         touched for other reasons, no urgency since this redirect is
         instant and correct either way. -->
    <script>location.replace('app/index.html')</script>
  </body>
