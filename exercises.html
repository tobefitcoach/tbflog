<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise Library — TBFlog</title>
    <link rel="stylesheet" href="style.css?v=6" />
    <link rel="stylesheet" href="athlete.css?v=7" />
  </head>
  <body>

    <header>
      <h1>TBFLOG</h1>
      <div style="display:flex; align-items:center; gap:16px">
        <button class="header-link" id="logoutBtn">Log Out</button>
      </div>
    </header>

    <div class="app-layout">
      <nav class="sidebar" id="pageSidebar">
        <button class="sidebar-toggle-btn" id="sidebarToggleBtn" title="Collapse sidebar">‹</button>
        <div class="sidebar-links" id="sidebarLinks">
          <a href="index.html" class="sidebar-link">Dashboard</a>
          <div class="sidebar-item-hover">
            <span class="sidebar-link active">Library</span>
            <div class="sidebar-submenu">
              <a href="exercises.html">Exercise Library</a>
              <a href="trainings.html">Training Library</a>
              <a href="programs.html">Program Library</a>
            </div>
          </div>
        </div>
      </nav>

      <div class="dashboard">
        <div class="dashboard-header">
          <h2>Exercise Library <span class="count-badge" id="exerciseTotalCount"></span></h2>
          <button class="btn-add" id="addExerciseBtn">+ Add Exercise</button>
        </div>
        <div id="exerciseList"></div>
      </div>
    </div>

    <!-- Add/Edit Exercise Modal - same modal serves both, driven by
         currentExercise in exercises.js -->
    <div class="modal-overlay" id="exerciseModal">
      <div class="modal">
        <div class="graph-modal-header">
          <h2 id="exerciseModalTitle">Add Exercise</h2>
          <button class="btn-cancel" id="closeExerciseModalBtn">✕</button>
        </div>
        <div class="form-group">
          <label>Name</label>
          <input type="text" id="exerciseName" placeholder="e.g. Barbell Back Squat" />
        </div>
        <div class="form-group">
          <label>Category</label>
          <select id="exerciseCategory">
            <option value="__new__">+ Add New Category</option>
          </select>
        </div>
        <div class="form-group" id="exerciseNewCategoryGroup" style="display:none">
          <label>New Category Name</label>
          <input type="text" id="exerciseNewCategory" placeholder="e.g. Legs, Push, Cardio" />
        </div>
        <div class="form-group">
          <label>Type</label>
          <select id="exerciseType">
            <option value="weights">Weightlifting (sets, reps, weight)</option>
            <option value="timed">Timed (sets, duration)</option>
            <option value="__new__">+ Add New Type</option>
          </select>
        </div>
        <div class="form-group" id="exerciseNewTypeGroup" style="display:none">
          <label>New Type Name</label>
          <input type="text" id="exerciseNewType" placeholder="e.g. Plyometric" />
        </div>
        <div class="form-group">
          <label>Video Link (optional)</label>
          <input type="url" id="exerciseVideoUrl" placeholder="https://youtube.com/..." />
        </div>
        <div class="form-group">
          <label>Instructions (optional)</label>
          <textarea id="exerciseInstructions" class="notes-textarea" placeholder="Cues, setup notes, form reminders..."></textarea>
        </div>
        <div class="form-actions">
          <button class="btn-cancel" id="cancelExerciseBtn">Cancel</button>
          <button class="btn-save" id="saveExerciseBtn">Save</button>
        </div>
      </div>
    </div>

    <script type="module" src="exercises.js?v=1"></script>
    <script type="module" src="sidebar.js?v=1"></script>
  </body>
</html>
