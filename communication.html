<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Communication — TBFlog</title>
    <link rel="stylesheet" href="style.css?v=23" />
    <link rel="stylesheet" href="athlete.css?v=48" />
  </head>
  <body>

    <header>
      <a href="index.html" class="header-logo-link"><img src="logo.png?v=1" alt="TBFlog" class="header-logo"></a>
      <div style="display:flex; align-items:center; gap:16px">
        <button class="header-link" id="logoutBtn">Log Out</button>
      </div>
    </header>

    <div class="app-layout">
      <nav class="sidebar" id="pageSidebar">
        <button class="sidebar-toggle-btn" id="sidebarToggleBtn" title="Collapse sidebar">‹</button>
        <div class="sidebar-links" id="sidebarLinks">
          <div class="sidebar-item-hover" id="athletesNavItem">
            <a href="index.html" class="sidebar-link">Athletes</a>
            <div class="sidebar-submenu">
              <a href="index.html?status=active">Active</a>
              <a href="index.html?status=pending">Pending</a>
              <a href="index.html?status=offline">Offline</a>
              <a href="index.html?status=archived">Archived</a>
            </div>
          </div>
          <a href="communication.html" class="sidebar-link active">💬 Communication</a>
          <div class="sidebar-item-hover">
            <span class="sidebar-link">Library</span>
            <div class="sidebar-submenu">
              <a href="exercises.html">Exercise Library</a>
              <a href="sections.html">Section Library</a>
              <a href="trainings.html">Workout Library</a>
              <a href="programs.html">Program Library</a>
            </div>
          </div>
          <a href="stretches.html" class="sidebar-link">Stretch Library</a>
          <a href="settings.html" class="sidebar-link">⚙ Settings</a>
        </div>
      </nav>

      <!-- Two-pane inbox: athlete list on the left (loaded from
           loadCommsAthletes() in communication.js), the selected athlete's
           full chat_messages history + a send box on the right - see
           selectCommsAthlete(). Supports ?id= to deep-link straight into
           one athlete's conversation (used by the notification bell and
           push notifications for a new chat message). -->
      <div class="dashboard comms-page">
        <div class="dashboard-header">
          <h2>Communication</h2>
        </div>
        <div class="comms-layout">
          <div class="comms-athlete-list" id="commsAthleteList">
            <p class="no-metrics">Loading...</p>
          </div>
          <div class="comms-chat-pane">
            <p class="no-metrics" id="commsEmptyState">Select an athlete on the left to see your conversation.</p>
            <div id="commsActiveChat" style="display:none">
              <div class="comms-chat-header" id="commsChatHeader"></div>
              <div class="chat-messages" id="chatMessages"></div>
              <div class="chat-input-row">
                <input type="text" id="chatInput" placeholder="Type a message..." maxlength="2000" />
                <button type="button" class="btn-save" id="chatSendBtn">Send</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="loading-bar.js?v=1"></script>
    <script type="module" src="confirm-modal.js?v=1"></script>
    <script type="module" src="network-retry.js?v=1"></script>
    <script type="module" src="communication.js?v=1"></script>
    <script type="module" src="bell.js?v=4"></script>
    <script type="module" src="sidebar.js?v=2"></script>
  </body>
</html>
